name: ImageSort
options:
  bundleIdPrefix: com.hudsonpaine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  ImageSort:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "ImageSort needs access to your photo library so you can swipe through and rate photos in your albums."
        NSPhotoLibraryAddUsageDescription: "ImageSort creates albums in your photo library to save the photos you keep."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hudsonpaine.ImageSort
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9FZB4GGWZJ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
